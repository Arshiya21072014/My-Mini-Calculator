<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Simple Calculator</title>
  </head>
  <body>
    <h1>Simple Calculator</h1>
<p>Perform all operations using JavaScript</p>
<p id="add"></p>
<p id="sub"></p>
<p id="mul"></p>
<p id="div"></p>
<script>
   let a = 10;
let b = 5;
document.getElementById("add").innerHTML = "Addition = " + (a + b);
document.getElementById("sub").innerHTML = "Subtraction = " + (a - b);
document.getElementById("mul").innerHTML = "Multiplication = " + (a * b);
document.getElementById("div").innerHTML = "Division = " + (a / b);
</script>
  </body>
</html>
